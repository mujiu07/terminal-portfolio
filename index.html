<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>mujiu's Terminal Portfolio</title>
    <meta name="title" content="mujiu's Terminal Portfolio" />
    <meta
      name="description"
      content="mujiu's terminal portfolio website built with React."
    />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://mujiu.net/" />
    <meta property="og:title" content="mujiu's Terminal Portfolio" />

      property="og:description"
      content="mujiu's terminal portfolio website built with React."

    <meta property="twitter:card" content="summary_large_image" />

      property="twitter:description"

    />

      property="twitter:image"
      content="https://mujiu.net/og.png"

    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />

    <link rel="mask-icon" color="#1d2a35" />
    <meta name="msapplication-TileColor" content="#1d2a35" />
